[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="nexxus-backend"
version="0.1.0"
requires-python=">=3.12"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.34,<1","sqlalchemy[asyncio]>=2.0,<3","asyncpg>=0.30,<1","alembic>=1.14,<2","pydantic-settings>=2.7,<3","pyjwt[crypto]>=2.10,<3","pwdlib[argon2]>=0.2,<1","pgvector>=0.3,<1","email-validator>=2.2,<3"]
[project.optional-dependencies]
dev=["pytest>=8,<9","pytest-asyncio>=0.25,<1","httpx>=0.28,<1","ruff>=0.9,<1"]
[tool.pytest.ini_options]
asyncio_mode="auto"
