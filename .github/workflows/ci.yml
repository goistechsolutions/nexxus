name: Foundation CI

on:
  pull_request:
  push:
    branches: [main, feat/**]

permissions:
  contents: read

jobs:
  foundation:
    name: Lint and test governed foundation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint foundation
        run: |
          ruff check \
            app/api/v1 \
            app/core/config.py \
            app/core/observability.py \
            app/core/security.py \
            app/core/tenancy.py \
            app/domain \
            app/infrastructure \
            app/main.py \
            tests/test_health.py \
            tests/test_tenant_context.py

      - name: Test foundation
        run: pytest -q tests/test_health.py tests/test_tenant_context.py
